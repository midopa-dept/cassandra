<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cassandra: the seer. An eye that observes, inside scanning rings. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- outer scanning rings (the observe loop) -->
  <g fill="none" stroke="url(#ring)" stroke-linecap="round">
    <circle cx="64" cy="64" r="56" stroke-width="4" opacity="0.35"/>
    <circle cx="64" cy="64" r="44" stroke-width="4" opacity="0.6"
            stroke-dasharray="150 120" transform="rotate(-40 64 64)"/>
    <circle cx="64" cy="64" r="33" stroke-width="4" opacity="0.9"
            stroke-dasharray="90 120" transform="rotate(120 64 64)"/>
  </g>

  <!-- the eye -->
  <path d="M64 40 C46 40 33 52 28 64 C33 76 46 88 64 88 C82 88 95 76 100 64 C95 52 82 40 64 40 Z"
        fill="#0b1020" stroke="url(#ring)" stroke-width="4"/>
  <!-- iris / pupil: the point of focus -->
  <circle cx="64" cy="64" r="14" fill="url(#ring)"/>
  <circle cx="64" cy="64" r="6" fill="#0b1020"/>
  <!-- glint -->
  <circle cx="69" cy="59" r="2.5" fill="#ffffff"/>
</svg>
