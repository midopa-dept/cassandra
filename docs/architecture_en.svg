<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="senseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a1a"/>
      <stop offset="1" stop-color="#121f12"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a1a"/>
      <stop offset="1" stop-color="#1f1212"/>
    </linearGradient>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8892a0"/>
    </marker>
  </defs>

  <rect width="720" height="520" rx="12" fill="#0d1117"/>

  <!-- BRAIN -->
  <rect x="40" y="20" width="640" height="130" rx="10" fill="url(#brainGrad)" stroke="#4a5568" stroke-width="1.5"/>
  <text x="60" y="48" fill="#e2c8ff" font-size="14" font-weight="bold">LLM coding agent = BRAIN</text>
  <text x="60" y="72" fill="#b0b8c8" font-size="12">· Reads the JSON(observations) Cassandra returns</text>
  <text x="60" y="90" fill="#b0b8c8" font-size="12">· Judges "what path opens without credentials?"</text>
  <text x="60" y="108" fill="#b0b8c8" font-size="12">· Decides which tool, with which payload, next</text>
  <text x="60" y="126" fill="#b0b8c8" font-size="12">· Final judgment: "this is / is not a vulnerability"</text>

  <line x1="360" y1="150" x2="360" y2="195" stroke="#8892a0" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="370" y="172" fill="#8892a0" font-size="11">run_shell: python -m core.main &lt;cmd&gt;</text>
  <text x="370" y="186" fill="#666e7a" font-size="10">(tool call — typed by the LLM)</text>

  <!-- CASSANDRA -->
  <rect x="40" y="200" width="640" height="160" rx="10" fill="url(#senseGrad)" stroke="#3a6a3a" stroke-width="1.5"/>
  <text x="60" y="228" fill="#a0e8a0" font-size="14" font-weight="bold">Cassandra = senses + means</text>
  <text x="60" y="254" fill="#80c880" font-size="12" font-family="monospace">scan        → unauth surface observation → JSON</text>
  <text x="60" y="274" fill="#80c880" font-size="12" font-family="monospace">sqli        → injection probe(tech·cols·schema·creds) → JSON</text>
  <text x="60" y="294" fill="#80c880" font-size="12" font-family="monospace">sqli-login  → login-form injection(bypass/extract)   → JSON</text>
  <text x="60" y="314" fill="#80c880" font-size="12" font-family="monospace">bruteforce  → dictionary vs target's reaction         → JSON</text>
  <text x="60" y="334" fill="#80c880" font-size="12" font-family="monospace">exploit     → runs the payload the LLM specified       → JSON</text>
  <text x="60" y="354" fill="#80c880" font-size="12" font-family="monospace">verify      → reproduce + before/after(reproduced)     → JSON</text>

  <line x1="360" y1="360" x2="360" y2="405" stroke="#8892a0" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="370" y="388" fill="#8892a0" font-size="11">HTTP(S)</text>

  <!-- TARGET -->
  <rect x="40" y="410" width="640" height="80" rx="10" fill="url(#targetGrad)" stroke="#6a3a3a" stroke-width="1.5"/>
  <text x="60" y="440" fill="#e8a0a0" font-size="14" font-weight="bold">Target web app</text>
  <text x="60" y="464" fill="#c88888" font-size="12">DVWA · Juice Shop · WebGoat · bWAPP · (real HackerOne programs)</text>

  <text x="690" y="90" fill="#4a5568" font-size="10" text-anchor="end" transform="rotate(-90,690,90)">judges</text>
  <text x="690" y="280" fill="#4a5568" font-size="10" text-anchor="end" transform="rotate(-90,690,280)">reports facts</text>
  <text x="690" y="450" fill="#4a5568" font-size="10" text-anchor="end" transform="rotate(-90,690,450)">reacts</text>
</svg>
