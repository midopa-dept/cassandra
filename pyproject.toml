[project]
name = "bugbounty-bot"
version = "0.1.0"
description = "Automated bug bounty discovery, reporting, and submission bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "flask>=3.0",
    "apscheduler>=3.10",
    "dnspython>=2.4",
    "playwright>=1.40",
    "openai>=1.0",
    "anthropic>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "flask-socketio>=5.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bugbounty-bot = "core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "asset", "scanner", "triage", "hackerone", "web"]
